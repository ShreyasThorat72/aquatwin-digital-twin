services:
  - type: web
    name: aquatwin-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: DATABASE_URL
        fromDatabase:
          name: aquatwin-db
          property: connectionString

databases:
  - name: aquatwin-db
    databaseName: aquatwin
    user: aquatwin_user
